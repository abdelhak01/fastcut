name: Construire l'APK FASTCUT

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o outils.zip
          unzip -q outils.zip
          mv cmdline-tools latest
          rm outils.zip
          SDK="$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --sdk_root="$HOME/android-sdk" --licenses > /dev/null 2>&1 || true
          "$SDK" --sdk_root="$HOME/android-sdk" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Copier l'application web dans l'APK
        run: |
          mkdir -p apk/app/src/main/assets
          cp index.html moteur.js dxf.js exports.js manifest.json \
             icone.svg icone-192.png icone-512.png \
             apk/app/src/main/assets/
          echo "Fichiers embarqués :"
          ls -la apk/app/src/main/assets/

      - name: Préparer les icônes
        run: |
          cd apk/app/src/main/res
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$d"
            cp "$GITHUB_WORKSPACE/icone-192.png" "$d/ic_launcher.png"
          done
          ls mipmap-hdpi/

      - name: Compiler l'APK
        run: |
          cd apk
          gradle wrapper --gradle-version 8.4 --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          cd apk
          find . -name "*.apk"
          cp app/build/outputs/apk/debug/app-debug.apk FASTCUT.apk
          ls -la FASTCUT.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name:
