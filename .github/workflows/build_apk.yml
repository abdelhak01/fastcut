name: Construire l'APK FASTCUT

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        run: |
          mkdir -p /home/runner/android-sdk/cmdline-tools
          cd /home/runner/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o outils.zip
          unzip -q outils.zip
          mv cmdline-tools latest
          rm outils.zip
          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Copier l'application web dans l'APK
        run: |
          mkdir -p apk/app/src/main/assets
          cp index.html moteur.js dxf.js exports.js manifest.json icone.svg icone-192.png icone-512.png apk/app/src/main/assets/
          ls -la apk/app/src/main/assets/

      - name: Préparer les icônes
        run: |
          mkdir -p apk/app/src/main/res/mipmap-mdpi
          mkdir -p apk/app/src/main/res/mipmap-hdpi
          mkdir -p apk/app/src/main/res/mipmap-xhdpi
          mkdir -p apk/app/src/main/res/mipmap-xxhdpi
          mkdir -p apk/app/src/main/res/mipmap-xxxhdpi
          cp icone-192.png apk/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icone-192.png apk/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icone-192.png apk/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icone-192.png apk/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp
